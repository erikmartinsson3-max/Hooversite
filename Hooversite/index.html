<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIA_SYS</title>

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="site-header">
    <div class="site-logo">MEDIA_SYS</div>
    <ul class="site-nav" id="filterNav"></ul>
    <div class="site-status">status: <span>online</span></div>
  </header>

  <!-- GALLERY -->
  <div class="section-label">// gallery index</div>
  <div class="media-grid" id="mediaGrid">
    <!-- thumbnails loaded from media.json -->
  </div>

</div><!-- /shell -->

<!-- ── LIGHTBOX OVERLAY ── -->
<div id="lightbox">
  <div id="lightboxBackdrop"></div>
  <div id="lightboxContent">
    <button id="lightboxClose">&#x2715; close</button>

    <!-- VIDEO MODE -->
    <div id="lightboxPlayer">
      <div class="player-screen" id="playerScreen">
        <div class="scanline"></div>
        <video id="player" playsinline></video>
      </div>
      <div class="player-bar">
        <div class="bar-top">
          <div class="bar-seg">
            <button class="ctrl-btn" id="btnRew" aria-label="Rewind">&#x25C4;&#x25C4;</button>
            <button class="ctrl-btn play-btn" id="btnPlay" aria-label="Play">&#x25B6;</button>
            <button class="ctrl-btn" id="btnFwd" aria-label="Skip forward">&#x25BA;&#x25BA;</button>
          </div>
          <span class="bar-div">|</span>
          <div class="bar-seg">
            <span class="time-display" id="timeDisplay">00:00 / 00:00<span class="blink">_</span></span>
          </div>
          <span class="bar-div">|</span>
          <div class="bar-seg">
            <span class="vol-display" id="volDisplay" title="Click to toggle mute" style="cursor:pointer">VOL:100</span>
          </div>
          <span class="bar-div">|</span>
          <div class="bar-seg">
            <button class="ctrl-btn" id="btnFs" aria-label="Fullscreen">&#x25A1;</button>
          </div>
          <span class="rec-indicator"><span class="blink">&#x25A0;</span> REC</span>
        </div>
        <div class="bar-bottom">
          <span class="prog-label">00:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="prog-blocks" id="progBlocks"></div>
            <div class="prog-ticks" id="progTicks"></div>
          </div>
          <span class="prog-label" id="progEnd">00:00</span>
        </div>
      </div>
    </div>

    <!-- PHOTO MODE -->
    <div id="lightboxPhoto">
      <img id="photoImg" src="" alt="" />
    </div>

    <!-- META (shared) -->
    <div class="meta-bar">
      <span class="meta-filename" id="metaFilename"></span>
      <span class="meta-info" id="metaInfo"></span>
    </div>
    <div class="tag-row" id="tagRow"></div>

  </div><!-- /lightboxContent -->
</div><!-- /lightbox -->

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="js/player.js"></script>
</body>
</html>
