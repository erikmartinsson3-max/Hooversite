<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIA_SYS</title>

  <!-- Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <!-- Monospace font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
 
  
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="site-header">
    <div class="site-logo">MEDIA_SYS</div>
    <ul class="site-nav" id="filterNav">
    </ul>
    <div class="site-status">status: <span>online</span></div>
  </header>



  <!-- GALLERY -->
<div class="section-label"></div>
<div class="media-grid" id="mediaGrid">
  <!-- thumbnails are loaded automatically from media.json -->
</div>

</div><!-- /shell -->

<!-- Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="js/player.js"></script>


  <!-- LIGHTBOX OVERLAY -->
<div id="lightbox" style="display:none;">
  <div id="lightboxBackdrop"></div>
  <div id="lightboxContent">
    <button id="lightboxClose">&#x2715;</button>
    <div id="lightboxPlayer" style="display:none;">
      <video id="player" playsinline></video>
    </div>
    <div id="lightboxPhoto" style="display:none;">
      <img id="photoImg" src="" alt="" />
    </div>
    <div id="lightboxMeta">
      <span id="metaFilename"></span>
      <span id="metaInfo"></span>
    </div>
    <div id="lightboxTags" class="tag-row"></div>
  </div>
</div> 
</body>
</html>
